    - name: فك ملف المشروع
      run: |
        mkdir -p project
        ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip")
        unzip -q "$ZIP_FILE" -d project

    - name: العثور على مشروع Android وبناء APK
      run: |
        # البحث الشامل عن ملف gradlew في أي مجلد فرعي
        GRADLEW=$(find project -type f -name "gradlew" -print -quit)
        
        if [ -z "$GRADLEW" ]; then
          echo "لم يتم العثور على ملف gradlew"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW")
        echo "تم العثور على المشروع في: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug
